; NSIS script for the Windows installer. CI builds it with
;   makensis -DVERSION=<x.y.z> installer.ini
; Silent install/uninstall (used by winget): /S
!define APPNAME "CView"
!define COMPANYNAME "MAVENs Research Group"
!define DESCRIPTION "Crystal Structure Visualization"
!ifndef VERSION
  !define VERSION "0.0.0"
!endif
!define UNINSTKEY "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}"

RequestExecutionLevel admin

; Install to Program Files
InstallDir "$PROGRAMFILES64\${APPNAME}"
InstallDirRegKey HKLM "${UNINSTKEY}" "InstallLocation"

Name "${APPNAME}"
OutFile "cview-installer.exe"

Page directory
Page instfiles

Section "install"
    ; Shortcuts for all users, not just the admin account that ran the installer
    SetShellVarContext all
    SetRegView 64
    SetOutPath $INSTDIR

    ; Copy all bundled files (exe, dlls, icons, schemas) from dist
    File /r "dist\*"

    WriteUninstaller "$INSTDIR\uninstall.exe"

    ; Create Start Menu Shortcut
    CreateShortcut "$SMPROGRAMS\${APPNAME}.lnk" "$INSTDIR\cview.exe" "" "$INSTDIR\cview.exe" 0

    ; "Installed apps" entry: lets Windows and winget find, upgrade and remove CView
    WriteRegStr HKLM "${UNINSTKEY}" "DisplayName" "${APPNAME}"
    WriteRegStr HKLM "${UNINSTKEY}" "DisplayVersion" "${VERSION}"
    WriteRegStr HKLM "${UNINSTKEY}" "Publisher" "${COMPANYNAME}"
    WriteRegStr HKLM "${UNINSTKEY}" "DisplayIcon" "$INSTDIR\cview.exe"
    WriteRegStr HKLM "${UNINSTKEY}" "InstallLocation" "$INSTDIR"
    WriteRegStr HKLM "${UNINSTKEY}" "UninstallString" '"$INSTDIR\uninstall.exe"'
    WriteRegStr HKLM "${UNINSTKEY}" "QuietUninstallString" '"$INSTDIR\uninstall.exe" /S'
    WriteRegStr HKLM "${UNINSTKEY}" "URLInfoAbout" "https://mavensgroup.github.io/cview/"
    WriteRegDWORD HKLM "${UNINSTKEY}" "NoModify" 1
    WriteRegDWORD HKLM "${UNINSTKEY}" "NoRepair" 1
SectionEnd

Section "uninstall"
    SetShellVarContext all
    SetRegView 64
    Delete "$SMPROGRAMS\${APPNAME}.lnk"
    ; Removes the exe, DLLs, data folders and uninstaller
    RmDir /r "$INSTDIR"
    DeleteRegKey HKLM "${UNINSTKEY}"
SectionEnd
