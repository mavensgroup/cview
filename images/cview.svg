<?xml version="1.0" encoding="UTF-8"?>
<!-- CView logo (reciprocal Brillouin polyhedron), two-tone for the docs.
     Same shapes as assets/org.mavensgroup.cview.svg. Drawn in currentColor,
     with the colour set here because an <img> cannot inherit the page's:
     dark grey on a light page, white on a dark one. The centre dot is cut
     out, so the page shows through in either theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 96 96" width="96" height="96">
  <style>
    svg { color: #24292f; }
    @media (prefers-color-scheme: dark) {
      svg { color: #ffffff; }
    }
  </style>
  <defs>
    <mask id="centre">
      <rect x="0" y="0" width="128" height="128" fill="#fff"/>
      <circle cx="64" cy="65" r="3.5" fill="#000"/>
    </mask>
  </defs>
  <g fill="currentColor" mask="url(#centre)">
    <path d="M 62,19 L 32,36 L 19,57 L 19,75 L 32,86 L 62,69 Z"/>
    <path opacity="0.5" d="M 66,19 L 96,36 L 109,57 L 109,75 L 96,86 L 66,69 Z"/>
    <path d="M 34,90 L 64,109 L 94,90 L 64,73 Z"/>
  </g>
</svg>
